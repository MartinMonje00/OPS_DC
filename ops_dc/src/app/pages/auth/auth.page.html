<ion-content class="auth-content">
  <div class="auth-wrapper">

    <div class="auth-card">

      <div class="auth-header">
        <div class="building-icon-wrapper">
          <ion-icon name="business-outline" class="building-icon"></ion-icon>
        </div>
        <h1 class="auth-title">S&A Business Hub</h1>
        <span class="auth-subtitle">SISTEMA DE CONTROL</span>
      </div>

      <form [formGroup]="form" class="auth-form" (ngSubmit)="submit()">
        <div class="form-group">
          <label class="field-label">Usuario</label>
          <input
            id="username"
            type="text"
            class="custom-input"
            placeholder="Ingresa tu usuario"
            formControlName="username"
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label class="field-label">Contraseña</label>
          <input 
            id="password"
            type="password" 
            class="custom-input" 
            placeholder="Ingresa tu contraseña"
            formControlName="password"
            autocomplete="current-password"
          />
        </div>

        <div class="form-actions">
          <ion-button expand="block" mode="md" type="submit" class="gradient-submit-btn" [disabled]="form.invalid">
            INICIAR SESIÓN
          </ion-button>
        </div>

      </form>

      <div class="auth-footer">
        <span class="version-info">v1.0.0 · ops dc</span>
        <span class="copyright-info">© 2026 S&A Chile. Todos los derechos reservados.</span>
      </div>

    </div>

  </div>
</ion-content>
