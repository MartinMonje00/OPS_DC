<div class="modal-card">
  <div class="modal-header">
    <div class="header-title">
      <ion-icon [name]="isEditMode ? 'create-outline' : 'person-add-outline'" class="header-icon"></ion-icon>
      <h2>{{ isEditMode ? 'Editar Contacto' : 'Nuevo Contacto' }}</h2>
    </div>
    <button type="button" class="btn-close" (click)="closeModal()">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>

  <div class="modal-divider"></div>

  <form [formGroup]="form" class="form-body" (ngSubmit)="saveContact()">
    <div class="input-grid-2">
      <div class="custom-input-box">
        <label class="input-label">Nombre Completo</label>
        <div class="input-wrapper">
          <ion-icon name="person-outline" class="input-icon"></ion-icon>
          <input type="text" formControlName="name" placeholder="Ingresa el nombre" class="native-input">
        </div>
      </div>

      <div class="custom-input-box">
        <label class="input-label">Empresa</label>
        <div class="input-wrapper">
          <ion-icon name="business-outline" class="input-icon"></ion-icon>
          <input type="text" formControlName="company" placeholder="Ingresa la empresa" class="native-input">
        </div>
      </div>

      <div class="custom-input-box">
        <label class="input-label">Cargo</label>
        <div class="input-wrapper">
          <ion-icon name="briefcase-outline" class="input-icon"></ion-icon>
          <input type="text" formControlName="charge" placeholder="Ingresa el cargo" class="native-input">
        </div>
      </div>

      <div class="custom-input-box">
        <label class="input-label">Correo Electrónico</label>
        <div class="input-wrapper">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <input type="email" formControlName="email" placeholder="Ingresa el correo" class="native-input">
        </div>
      </div>

      <div class="custom-input-box">
        <label class="input-label">Teléfono</label>
        <div class="input-wrapper">
          <ion-icon name="call-outline" class="input-icon"></ion-icon>
          <input type="tel" formControlName="telephone" placeholder="Ingresa el numero de teléfono" class="native-input">
        </div>
      </div>
    
      <div class="custom-select-box">
        <label class="section-label">TIPO DE CONTACTO</label>
        <div class="select-container">
          <select formControlName="type" class="native-select">
            @for (t of contactTypes; track t.value) {
              <option [value]="t.value">{{ t.label }}</option>
            }
          </select>
          <ion-icon name="chevron-down-outline" class="select-arrow"></ion-icon>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="closeModal()">Cancelar</button>
      <button type="submit" class="btn-submit" [disabled]="form.invalid">
        <ion-icon [name]="isEditMode ? 'save-outline' : 'add-circle-outline'"></ion-icon>
        <span>{{ isEditMode ? 'Guardar Cambios' : 'Registrar Contacto' }}</span>
      </button>
    </div>
  </form>
</div>
