<div class="modal-card">
  <div class="modal-header">
    <div class="header-title">
      <ion-icon name="person-add-outline" class="header-icon"></ion-icon>
      <h2>Crear Nuevo Usuario</h2>
    </div>
    <button type="button" class="btn-close" (click)="closeModal()">
      <ion-icon name="close-outline"></ion-icon>
    </button>
  </div>
  <div class="modal-divider"></div>
  <form [formGroup]="form" class="form-body" (ngSubmit)="createUser()">
    <div class="inputs-grid">
      <app-custom-app-input
        [control]="getFormControl('name')"
        type="text"
        label="Nombre Completo *"
        icon="person-outline"
        autocomplete="off">
      </app-custom-app-input>
      <app-custom-app-input
        [control]="getFormControl('username')"
        type="text"
        label="Usuario *"
        icon="person-outline"
        autocomplete="off">
      </app-custom-app-input>
      <app-custom-app-input
        [control]="getFormControl('email')"
        type="email"
        label="Email *"
        icon="mail-outline"
        autocomplete="email">
      </app-custom-app-input>
      <app-custom-app-input
        [control]="getFormControl('password')"
        type="password"
        label="Contraseña *"
        icon="lock-closed-outline"
        autocomplete="off">
      </app-custom-app-input>
    </div>
    <div class="role-select-box">
      <label class="section-label">ROL ASIGNADO</label>
      <div class="select-container">
        <select formControlName="role" class="native-select">
          @for (role of roles; track role.value) {
            <option [value]="role.value">{{ role.label }}</option>
          }
        </select>
        <ion-icon name="chevron-down-outline" class="select-arrow"></ion-icon>
      </div>
    </div>
  </form>
  <div class="modal-footer"><button type="button" class="btn-cancel" (click)="closeModal()">Cancelar</button>
    <button
      type="button"
      class="btn-submit"
      (click)="createUser()"
      [disabled]="form.invalid">
      <ion-icon name="person-add-outline"></ion-icon>
      <span>Crear Usuario</span>
    </button>
  </div>
</div>
